[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# The only place the suite's import roots are declared. Relative to rootdir, so every
# caller — make, CI, an IDE — gets the same sys.path without exporting PYTHONPATH.
# `packages` and `apps/*` are path roots, not packages: one flat suite imports the
# shared core and both apps.
pythonpath = . packages apps/brujula apps/huella

# Two guards against the offline suite quietly becoming a network suite:
#   --strict-markers  — a typo'd @pytest.mark.livve errors instead of running unmarked
#   -m "not live"     — a bare `pytest` never hits the network. An explicit
#                       `pytest -m live` still wins: pytest keeps the last -m.
addopts = --strict-markers -q -m "not live"

markers =
    live: hits COROS's UCP/MCP endpoint, storefront feed, or Strava. Run sequentially, rarely.
